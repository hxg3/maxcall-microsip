name: Build MaxCare MicroSIP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download PJSIP 2.14.1
      shell: pwsh
      run: |
        $url = "https://github.com/pjsip/pjproject/archive/refs/tags/2.14.1.tar.gz"
        Invoke-WebRequest -Uri $url -OutFile pjsip.tar.gz -UseBasicParsing
        tar -xzf pjsip.tar.gz
        Rename-Item pjproject-2.14.1 pjsip
        Remove-Item pjsip.tar.gz

        # Create config_site.h (normally created by configure)
        "#include <pj/config_site_sample.h>" | Set-Content -Path "pjlib\include\pj\config_site.h" -Encoding UTF8
        "#include <pj/config_site_sample.h>" | Set-Content -Path "pjsip\pjlib\include\pj\config_site.h" -Encoding UTF8
        "#include <pj/config_site_sample.h>" | Set-Content -Path "pjmedia\pjlib\include\pj\config_site.h" -Encoding UTF8
        "#include <pj/config_site_sample.h>" | Set-Content -Path "pjnath\pjlib\include\pj\config_site.h" -Encoding UTF8
        "#include <pj/config_site_sample.h>" | Set-Content -Path "pjlib-util\pjlib\include\pj\config_site.h" -Encoding UTF8

        # Copy PJSIP to parent-level dirs for MicroSIP include paths (../pjlib/include, etc.)
        Copy-Item -Path "pjlib\*" -Destination "pjlib" -Recurse -Force
        Copy-Item -Path "pjsip\*" -Destination "pjsip" -Recurse -Force
        Copy-Item -Path "pjmedia\*" -Destination "pjmedia" -Recurse -Force
        Copy-Item -Path "pjnath\*" -Destination "pjnath" -Recurse -Force
        Copy-Item -Path "pjlib-util\*" -Destination "pjlib-util" -Recurse -Force

        # Ensure lib dir exists for output
        New-Item -ItemType Directory -Path "lib" -Force | Out-Null

        Write-Host "PJSIP prepared"

    - name: Build PJSIP via VS Solution
      shell: pwsh
      run: |
        $sln = "pjproject\pjproject-vs14.sln"
        Write-Host "Building PJSIP (Release-Static|Win32)..."
        msbuild $sln `
          /p:Configuration=Release-Static `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /verbosity:minimal `
          /nologo
        if ($LASTEXITCODE -ne 0) {
          Write-Host "PJSIP build failed, trying Release instead..."
          msbuild $sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /verbosity:minimal `
            /nologo
          if ($LASTEXITCODE -ne 0) { throw "PJSIP build failed" }
        }

    - name: Collect and Prepare Libraries
      shell: pwsh
      run: |
        $libDir = "lib"
        if (-not (Test-Path $libDir)) { New-Item -ItemType Directory -Path $libDir -Force }

        # Find all .lib files from PJSIP build (skip test/sample exes)
        $pjsipLibs = Get-ChildItem -Path "pjproject" -Recurse -Filter "*.lib" |
          Where-Object { $_.Length -gt 1024 -and $_.DirectoryName -match "lib" } |
          Sort-Object Name

        Write-Host "Found $($pjsipLibs.Count) PJSIP libraries:"
        foreach ($f in $pjsipLibs) {
          $kb = [math]::Round($f.Length / 1KB)
          Write-Host "  $($f.Name) ($kb KB)"
          Copy-Item $f.FullName -Destination $libDir -Force
        }

        # List what we have
        Write-Host "`nLibraries in lib/:"
        Get-ChildItem $libDir -Filter "*.lib" | ForEach-Object {
          Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB)) KB)"
        }

    - name: Build MicroSIP
      shell: pwsh
      run: |
        msbuild microsip.sln `
          /p:Configuration=Release `
          /p:Platform=Win32 `
          /verbosity:minimal `
          /nologo
        if ($LASTEXITCODE -ne 0) { throw "MicroSIP build failed" }

    - name: Package
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path "." -Recurse -Filter "microsip.exe" |
          Where-Object { $_.FullName -notmatch "pjproject|pjlib|pjsip|pjmedia|pjnath|pjlib-util" } |
          Select-Object -First 1

        if (-not $exe) {
          Write-Host "ERROR: microsip.exe not found"
          Get-ChildItem -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.FullName)" }
          exit 1
        }

        $sizeMB = [math]::Round($exe.Length / 1MB, 2)
        Write-Host "Found: $($exe.FullName) ($sizeMB MB)"
        Copy-Item $exe.FullName "MaxCare-MicroSIP.exe"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaxCare-MicroSIP
        path: MaxCare-MicroSIP.exe
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: MaxCare MicroSIP ${{ github.ref_name }}
        files: MaxCare-MicroSIP.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
