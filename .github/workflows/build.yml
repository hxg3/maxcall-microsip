name: Build MaxCare MicroSIP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Prepare PJSIP
      shell: pwsh
      run: |
        # Download
        $url = "https://github.com/pjsip/pjproject/archive/refs/tags/2.14.1.tar.gz"
        Invoke-WebRequest -Uri $url -OutFile pjsip.tar.gz -UseBasicParsing
        tar -xzf pjsip.tar.gz
        Rename-Item pjproject-2.14.1 pjproject
        Remove-Item pjsip.tar.gz

        # Create config_site.h with video support enabled
        @"
#define PJMEDIA_HAS_VIDEO 1
#include <pj/config_site_sample.h>
"@ | Set-Content -Path "pjproject\pjlib\include\pj\config_site.h" -Encoding UTF8

        # MicroSIP vcxproj expects ../pjlib/include, ../pjsip/include etc.
        # So we need the PJSIP component dirs at root level too
        $dirs = @("pjlib", "pjsip", "pjmedia", "pjnath", "pjlib-util")
        $configSite = @"
#define PJMEDIA_HAS_VIDEO 1
#include <pj/config_site_sample.h>
"@
        foreach ($d in $dirs) {
          if (Test-Path "pjproject\$d") {
            Copy-Item "pjproject\$d" $d -Recurse -Force
            $targetPath = "$d\include\pj\config_site.h"
            if (-not (Test-Path (Split-Path $targetPath))) {
              New-Item -ItemType Directory -Path (Split-Path $targetPath) -Force | Out-Null
            }
            $configSite | Set-Content -Path $targetPath -Encoding UTF8
          }
        }

        New-Item -ItemType Directory -Path "lib" -Force | Out-Null
        Write-Host "PJSIP ready"

    - name: Build PJSIP
      shell: pwsh
      run: |
        msbuild "pjproject\pjproject-vs14.sln" `
          /p:Configuration=Release-Static `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /verbosity:minimal `
          /nologo
        if ($LASTEXITCODE -ne 0) { throw "PJSIP build failed" }

    - name: Collect PJSIP Libraries
      shell: pwsh
      run: |
        # PJSIP VS builds to pjproject/lib/ (relative to pjproject/)
        $src = "pjproject\lib"
        if (Test-Path $src) {
          Get-ChildItem "$src\*.lib" | Where-Object { $_.Length -gt 1024 } | ForEach-Object {
            Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB)) KB)"
            Copy-Item $_.FullName "lib\" -Force
          }
        }

        # Also check individual project output dirs
        Get-ChildItem "pjproject" -Recurse -Filter "*.lib" |
          Where-Object { $_.Length -gt 1024 -and $_.DirectoryName -match "(build|lib)$" } |
          ForEach-Object {
            if (-not (Test-Path "lib\$($_.Name)")) {
              Write-Host "  (extra) $($_.Name)"
              Copy-Item $_.FullName "lib\" -Force
            }
          }

        Write-Host "`nAll libraries:"
        Get-ChildItem "lib\*.lib" | ForEach-Object {
          Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB)) KB)"
        }

    - name: Build MicroSIP
      shell: pwsh
      run: |
        msbuild microsip.sln `
          /p:Configuration=Release `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /verbosity:minimal `
          /nologo
        if ($LASTEXITCODE -ne 0) { throw "MicroSIP build failed" }

    - name: Package
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path "." -Recurse -Filter "microsip.exe" |
          Where-Object { $_.FullName -notmatch "pjproject" } |
          Select-Object -First 1

        if (-not $exe) {
          Write-Host "ERROR: microsip.exe not found"
          Get-ChildItem -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.FullName)" }
          exit 1
        }

        $sizeMB = [math]::Round($exe.Length / 1MB, 2)
        Write-Host "SUCCESS: $($exe.FullName) ($sizeMB MB)"
        Copy-Item $exe.FullName "MaxCare-MicroSIP.exe"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaxCare-MicroSIP
        path: MaxCare-MicroSIP.exe
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: MaxCare MicroSIP ${{ github.ref_name }}
        files: MaxCare-MicroSIP.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
